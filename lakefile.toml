name = "LocalAlgebrasLean"
version = "0.1.0"
keywords = ["math", "operator-algebras", "local-algebras", "quantum-lattice-systems"]
defaultTargets = ["LocalAlgebrasLean"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Pins: Lean v4.36.0-rc1 and Mathlib 625d891, the shared versions of the sibling libraries
# (user, 5 Oct 2026). Mathlib is the only dependency, by design (user, 6 Oct 2026).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[lean_lib]]
name = "LocalAlgebrasLean"

# The sealed statements and their proofs (verify/); `lake comparator` reads both modules.
[[lean_lib]]
name = "Verify"
srcDir = "verify"
roots = ["Challenge", "Solution"]
